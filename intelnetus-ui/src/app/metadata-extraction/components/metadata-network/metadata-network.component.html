<div class="network-container">
  <!-- Header Section -->
  <div class="network-header">
    <div class="header-content">
      <div class="title-section">
        <h3 class="network-title">
          <fa-icon [icon]="faNetworkWired" [size]="'sm'" class="me-2" />
          Network Visualization
        </h3>
        <p class="network-subtitle">Inspect the structure of the formed graph</p>
      </div>
      <div class="stats-section">
        <div class="stat-item">
          <span class="stat-value">{{nodes.length}}</span>
          <span class="stat-label">Nodes</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">{{edges.length}}</span>
          <span class="stat-label">Edges</span>
        </div>
      </div>
    </div>
  </div>
  <div class="network-content">
    <div #sigmaContainer class="sigma-container">
      @if(nodes.length == 0) {
      <span style="margin: auto;">No data</span>
      }
    </div>
  </div>
</div>
