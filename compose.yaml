version: "3"
services:
  db:
    image: mysql/mysql-server:8.0
    container_name: intelnetus-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      DB_ROOT_PASSWORD: $DB_ROOT_PASSWORD
      DB_NAME: $DB_NAME
      DB_USER: $DB_USER
      DB_PASSWORD: $DB_PASSWORD
      DB_PORT: $DB_PORT
    ports:
      - "3306:3306"
    volumes:
      - mysql_dbdata:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    networks:
      - intelnetus

        
  api:
      container_name: intelnetus-api
      build: ./intelnetus-api/
      ports:
          - '5000:5000'
      volumes:
          - ./../../DockerVolumes/.pybliometrics:/app/.pybliometrics
      networks:
          - intelnetus
      depends_on: 
          - db

  ui:
      container_name: intelnetus-ui
      build: ./intelnetus-ui/
      ports:
          - '4200:4200'
      networks:
          - intelnetus

volumes:
    mysql_dbdata:

networks:
    intelnetus:
        driver: bridge